services:
  og-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: headless-og-generator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - CACHE_DIR=/app/cache
    volumes:
      - og_cache_data:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  og_cache_data:
    driver: local
