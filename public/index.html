<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headless OpenGraph Engine | Live Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      background: rgba(9, 13, 22, 0.8);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .header-links a:hover {
      color: var(--accent);
    }

    main {
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 36px;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Form Panel */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, textarea, select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .theme-btn {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: capitalize;
      transition: all 0.2s;
    }

    .theme-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .theme-btn.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
    }

    .format-toggle {
      display: flex;
      gap: 8px;
    }

    .format-btn {
      flex: 1;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .format-btn.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    /* Preview Panel */
    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-hit {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-miss {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .stat-metric {
      color: var(--text-muted);
    }

    .stat-metric strong {
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .image-container {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1200 / 630;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
    }

    .image-container .spinner {
      position: absolute;
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .url-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .url-text {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡ OpenGraph Headless</span>
      <span class="brand-badge">Fast Engine</span>
    </div>
    <div class="header-links">
      <a href="/health" target="_blank">Health & Metrics</a>
    </div>
  </header>

  <main>
    <!-- Left Form Settings -->
    <div class="panel">
      <div class="panel-title">
        <span>⚙️ Card Parameters</span>
      </div>

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" value="Gerador Headless de OpenGraph" placeholder="Card Title">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Short description...">Arquitetura de Alta Performance com Cache Inteligente & Satori</textarea>
      </div>

      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" value="Igor Barduzzi" placeholder="Author name">
      </div>

      <div class="form-group">
        <label for="badge">Badge</label>
        <input type="text" id="badge" value="v1.0.0 Production" placeholder="e.g. v1.0, Blog, Guide">
      </div>

      <div class="form-group">
        <label for="tags">Tags (comma-separated)</label>
        <input type="text" id="tags" value="TypeScript, Fastify, Satori, Rust" placeholder="tag1, tag2">
      </div>

      <div class="form-group">
        <label>Theme</label>
        <div class="theme-grid" id="themeGrid">
          <button class="theme-btn active" data-theme="dark">Dark</button>
          <button class="theme-btn" data-theme="cyberpunk">Cyberpunk</button>
          <button class="theme-btn" data-theme="ocean">Ocean</button>
          <button class="theme-btn" data-theme="sunset">Sunset</button>
          <button class="theme-btn" data-theme="light">Light</button>
          <button class="theme-btn" data-theme="minimal">Minimal</button>
        </div>
      </div>

      <div class="form-group">
        <label>Format</label>
        <div class="format-toggle" id="formatToggle">
          <button class="format-btn active" data-format="png">PNG (Standard)</button>
          <button class="format-btn" data-format="webp">WebP (Compressed)</button>
        </div>
      </div>
    </div>

    <!-- Right Live Preview -->
    <div class="preview-section">
      <div class="stats-bar">
        <div class="stat-badge badge-miss" id="cacheBadge">CACHE CHECKING...</div>
        <div class="stat-metric">Response: <strong id="latencyMetric">0 ms</strong></div>
        <div class="stat-metric">Size: <strong id="sizeMetric">0 KB</strong></div>
        <div class="stat-metric">Key: <strong id="keyMetric">...</strong></div>
      </div>

      <div class="image-container">
        <div class="spinner" id="spinner"></div>
        <img id="previewImg" alt="Social Card Preview">
      </div>

      <div class="url-box">
        <span class="url-text" id="urlText">/api/og?title=...</span>
        <button class="copy-btn" id="copyBtn">Copy URL</button>
      </div>
    </div>
  </main>

  <footer>
    <p>Engineered with Fastify, Satori, Resvg Rust engine, and Single-Flight cache coalescing.</p>
  </footer>

  <script>
    let activeTheme = 'dark';
    let activeFormat = 'png';
    let debounceTimer = null;

    const titleInput = document.getElementById('title');
    const descInput = document.getElementById('description');
    const authorInput = document.getElementById('author');
    const badgeInput = document.getElementById('badge');
    const tagsInput = document.getElementById('tags');
    const previewImg = document.getElementById('previewImg');
    const spinner = document.getElementById('spinner');
    const cacheBadge = document.getElementById('cacheBadge');
    const latencyMetric = document.getElementById('latencyMetric');
    const sizeMetric = document.getElementById('sizeMetric');
    const keyMetric = document.getElementById('keyMetric');
    const urlText = document.getElementById('urlText');
    const copyBtn = document.getElementById('copyBtn');

    // Theme selector
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTheme = btn.dataset.theme;
        triggerUpdate();
      });
    });

    // Format selector
    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFormat = btn.dataset.format;
        triggerUpdate();
      });
    });

    [titleInput, descInput, authorInput, badgeInput, tagsInput].forEach(el => {
      el.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(triggerUpdate, 300);
      });
    });

    function buildUrl() {
      const params = new URLSearchParams();
      if (titleInput.value) params.set('title', titleInput.value);
      if (descInput.value) params.set('description', descInput.value);
      if (authorInput.value) params.set('author', authorInput.value);
      if (badgeInput.value) params.set('badge', badgeInput.value);
      if (tagsInput.value) params.set('tags', tagsInput.value);
      params.set('theme', activeTheme);
      params.set('format', activeFormat);

      return `/api/og?${params.toString()}`;
    }

    async function triggerUpdate() {
      const endpoint = buildUrl();
      const fullUrl = window.location.origin + endpoint;
      urlText.textContent = endpoint;

      spinner.style.display = 'block';
      previewImg.style.opacity = '0.5';

      const t0 = performance.now();
      try {
        const response = await fetch(endpoint);
        const duration = Math.round(performance.now() - t0);
        const cacheHeader = response.headers.get('X-Cache') || 'UNKNOWN';
        const cacheKey = response.headers.get('X-Cache-Key') || '';
        const blob = await response.blob();

        const imgUrl = URL.createObjectURL(blob);
        previewImg.src = imgUrl;

        // Update stats
        if (cacheHeader === 'HIT') {
          cacheBadge.textContent = '⚡ CACHE HIT';
          cacheBadge.className = 'stat-badge badge-hit';
        } else {
          cacheBadge.textContent = '🔨 CACHE MISS';
          cacheBadge.className = 'stat-badge badge-miss';
        }

        latencyMetric.textContent = `${duration} ms`;
        sizeMetric.textContent = `${(blob.size / 1024).toFixed(1)} KB`;
        keyMetric.textContent = cacheKey.substring(0, 10) + '...';
      } catch (err) {
        console.error('Failed to fetch preview image:', err);
      } finally {
        spinner.style.display = 'none';
        previewImg.style.opacity = '1';
      }
    }

    copyBtn.addEventListener('click', () => {
      const fullUrl = window.location.origin + buildUrl();
      navigator.clipboard.writeText(fullUrl).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy URL'; }, 1500);
      });
    });

    // Initial load
    triggerUpdate();
  </script>
</body>
</html>
