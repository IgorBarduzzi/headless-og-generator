name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: headless-og-generator/package-lock.json

      - name: Install dependencies
        working-directory: headless-og-generator
        run: npm ci

      - name: Run unit & integration tests
        working-directory: headless-og-generator
        run: npm test

      - name: Compile TypeScript
        working-directory: headless-og-generator
        run: npm run build
